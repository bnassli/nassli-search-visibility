name: Read-only public website audit
on:
  workflow_dispatch:
  schedule:
    - cron: '25 7 * * 1'  # Weekly UTC. Stop or adjust if site policy requires.
permissions:
  contents: read
jobs:
  seo-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bounded read-only website audit
        run: python -m src.nassli_audit --config config/site.json --output reports/current
      - name: Store private action artifact (no production writes)
        uses: actions/upload-artifact@v4
        with:
          name: nassli-technical-audit
          path: reports/current/
          retention-days: 30
