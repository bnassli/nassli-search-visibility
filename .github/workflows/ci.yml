name: Quality gate
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate site JSON
        run: python -c 'import json; from src.nassli_audit.audit import validate_config; validate_config(json.load(open("config/site.json")))'
